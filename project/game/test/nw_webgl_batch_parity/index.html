<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL batch NW.js parity</title>
    <style>
        :root { color-scheme: dark; font-family: Consolas, monospace; }
        body { margin: 32px; background: #111827; color: #e5e7eb; }
        h1 { font-size: 24px; }
        #status { padding: 20px; border: 1px solid #475569; border-radius: 8px; white-space: pre-wrap; }
        .pass { border-color: #22c55e !important; color: #bbf7d0; }
        .fail { border-color: #ef4444 !important; color: #fecaca; }
        #canvas-host { position: fixed; left: -10000px; top: -10000px; width: 1px; height: 1px; overflow: hidden; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "display/": "../../script/module/display/",
            "scene/": "../../script/module/scene/",
            "simulation/": "../../script/module/simulation/",
            "ui/": "../../script/module/ui/",
            "util/": "../../script/util/",
            "animation/": "../../script/module/animation/",
            "input/": "../../script/module/input/",
            "sound/": "../../script/module/sound/",
            "save/": "../../script/module/save/",
            "physics/": "../../script/module/physics/",
            "data/": "../../script/data/",
            "object/": "../../script/module/object/",
            "debug/": "../../script/module/debug/",
            "game/": "../../script/",
            "overlay/": "../../script/module/overlay/"
        }
    }
    </script>
</head>
<body>
    <h1>WebGL batch begin 상태 바인딩 픽셀 동일성 검사</h1>
    <div id="status">검사 준비 중…</div>
    <div id="canvas-host" aria-hidden="true"></div>
    <script type="module" src="./runner.js"></script>
</body>
</html>
